[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom"
version = "0.1.0"
description = "Axiom: a local-first procedural case simulator (backend)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "duckdb>=1.0",
    "pytz>=2024.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["axiom*"]

[tool.setuptools.package-data]
axiom = ["schema.sql", "*.json", "engine/benchmarks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: long-running sweeps (seed sweep); excluded by default, run with -m slow",
]
